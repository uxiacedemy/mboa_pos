name: MboaPOS integrity

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - run: flutter build apk --debug

      - run: npm ci
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm run test:integrity
        working-directory: functions

      - run: npm install --global firebase-tools@15.30.2
      - name: Run Firebase Emulator integration tests
        run: firebase emulators:exec --project mboapos --only auth,firestore,functions "node functions/test/emulator.integration.js"
