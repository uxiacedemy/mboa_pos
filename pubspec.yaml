name: mboa_pos
description: "MboaPOS - Point de Vente pour PME Camerounaises"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^14.6.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Secure storage (tokens — never SharedPreferences)
  flutter_secure_storage: ^9.2.2

  # Formatting
  intl: ^0.20.2

  # Unique IDs
  uuid: ^4.5.1

  # Immutable domain models
  freezed_annotation: ^3.1.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  freezed: ^3.2.3

flutter:
  uses-material-design: true
  generate: true